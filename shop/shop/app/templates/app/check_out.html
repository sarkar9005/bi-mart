<!DOCTYPE html>
{% load static %}
{% load product_tags %}
{% load get_dict %}
{% load custom_filters %}
<html>
<head>
</head>
<body>
    Address : {{ address }}
    Total price : ₹{{ cart_items|final_total}}
    <button id="rzp-button1">Pay</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
var price = {{ cart_items|final_total }} * 100; // Convert to paise

var options = {
    "key": "rzp_test_AZWeJbMpTsirBQ", // Enter the Key ID generated from the Dashboard
    "amount": price, // Amount is in paise
    "currency": "INR",
    "name": "Acme Corp", // Your business name
    "description": "Test Transaction",
    "image": "https://example.com/your_logo",
    "order_id": "{{ payment.id }}", // This is a sample Order ID. Pass the `id` obtained in the response of Step 1
    "handler": function(response) {
        window.location.href = `http://127.0.0.1:8000/success/?razorpay_payment_id=${response.razorpay_payment_id}&razorpay_order_id=${response.razorpay_order_id}&razorpay_signature=${response.razorpay_signature}`;
    },
    "prefill": {
        "name": "Harsh Singh", // Customer's name
        "email": "singhharshhs586@gmail.com",
        "contact": "8396090308" // Customer's phone number
    },
    "notes": {
        "address": "Razorpay Corporate Office"
    },
    "theme": {
        "color": "#3399cc"
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e) {
    rzp1.open();
    e.preventDefault();
}
</script>
</body>
</html>
